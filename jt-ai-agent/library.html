<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library · JT AI Agent</title><link rel="stylesheet" href="/jt-ai-agent/workspace.css"><style>.lib{max-width:900px;margin:55px auto;padding:24px}.lib h1{font:700 32px Manrope}.lib p{color:#9b9caf;line-height:1.7}.entry{padding:15px;border:1px solid #292a3b;border-radius:12px;background:#12131f;margin:10px 0}.entry a{color:#c8baff}.entry small{display:block;color:#8c8ea2;margin-top:5px}</style></head><body><main class="lib"><a href="/jt-ai-agent/" style="color:#b7a6ff">← Back to chat</a><h1>Library</h1><p>Your recent conversations saved in this browser. Cloud sync will require the JT account database and a server-side conversation storage feature.</p><div id="items"></div></main><script>const root=document.getElementById('items');let chats=[];try{chats=JSON.parse(localStorage.getItem('jt-ai-agent.chats.v1')||'[]')}catch{}if(!chats.length)root.textContent='No saved conversations in this browser yet.';else chats.sort((a,b)=>b.updated-a.updated).forEach(c=>{const e=document.createElement('article');e.className='entry';const a=document.createElement('a');a.href='/jt-ai-agent/';a.textContent=c.title||'New conversation';const s=document.createElement('small');s.textContent=(c.messages||[]).length+' messages · '+new Date(c.updated).toLocaleString();e.append(a,s);root.append(e)});</script></body></html>
