name: Normalize Agent Jeff v0.1.0 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/normalize-agent-jeff-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-stable-release:
    runs-on: ubuntu-latest
    steps:
      - name: Convert existing Agent Jeff release to a normal release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Tech-guy7-sys/jt-digital-world/releases/416461610 \
            -d @- <<'JSON'
          {
            "name": "Agent Jeff v0.1.0 — Windows x64",
            "prerelease": false,
            "draft": false,
            "body": "## Agent Jeff v0.1.0 — Windows x64\n\nThis release includes the self-contained Agent Jeff Windows desktop application, a Windows setup wizard, a portable ZIP, and SHA-256 checksums.\n\nThe build passed automated unit tests, installer compilation, and install/uninstall smoke checks on a Windows runner.\n\n**Security and compatibility note:** This installer is not code-signed, so Windows SmartScreen may display a warning. CI checks do not replace testing on your own Windows 11 computer. Review SHA256SUMS.txt before installing. This release is for Windows x64; macOS and Linux native builds are not included."
          }
          JSON
          )"
          printf '%s' "$response" | node -e '
            let s = "";
            process.stdin.on("data", c => s += c);
            process.stdin.on("end", () => {
              const r = JSON.parse(s);
              if (r.prerelease !== false || r.draft !== false) {
                console.error("Release was not converted to a published stable release.");
                process.exit(1);
              }
              console.log("Updated release:", r.html_url);
              console.log("Name:", r.name);
              console.log("Prerelease:", r.prerelease);
              console.log("Published:", Boolean(r.published_at));
            });
          '
