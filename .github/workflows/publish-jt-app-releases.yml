name: Publish JT app workspace releases
on:
  push:
    paths:
      - release-trigger.txt
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v0.1.0)
        required: true
        default: v0.1.0
permissions:
  contents: write
jobs:
  package-and-release:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: JT Studio
            slug: jt-studio
            files: "jt-apps/jt-studio/index.html|jt-apps/app.css|jt-apps/app.js|jt-apps/workspace-tools.js|jt-apps/pro-workspaces.js"
          - name: JT Motion
            slug: jt-motion
            files: "jt-apps/jt-motion/index.html|jt-apps/app.css|jt-apps/app.js|jt-apps/workspace-tools.js|jt-apps/pro-workspaces.js"
          - name: JT Cloud
            slug: jt-cloud
            files: "jt-apps/jt-cloud/index.html|jt-apps/app.css|jt-apps/app.js|jt-apps/workspace-tools.js|jt-apps/pro-workspaces.js"
          - name: JT Stream
            slug: jt-stream
            files: "jt-apps/jt-stream/index.html|jt-apps/jt-stream/studio.html|jt-apps/jt-stream/studio.css|jt-apps/jt-stream/studio.js|jt-apps/app.css|jt-apps/app.js|jt-apps/pro-workspaces.js"
          - name: JT App Manager
            slug: jt-app-manager
            files: "jt-apps/jt-app-manager/index.html|jt-apps/app.css|jt-apps/app.js|jt-apps/workspace-tools.js|jt-apps/pro-workspaces.js"
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate release version
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = (Get-Content release-trigger.txt -Raw).Trim()
          }
          if ($version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Version must match vMAJOR.MINOR.PATCH" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Stage standalone workspace files
        shell: pwsh
        run: |
          $root = "dist/${{ matrix.slug }}"
          $files = "${{ matrix.files }}".Split("|")
          foreach ($file in $files) {
            $target = Join-Path $root $file
            New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
            Copy-Item $file $target -Force
          }
          Compress-Archive -Path "$root/*" -DestinationPath "dist/${{ matrix.slug }}-${{ steps.meta.outputs.version }}.zip" -Force
          $zip = Get-Item "dist/${{ matrix.slug }}-${{ steps.meta.outputs.version }}.zip"
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($zip.Name)" | Set-Content "dist/${{ matrix.slug }}-SHA256SUMS.txt"
      - name: Publish workspace release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.slug }}-${{ steps.meta.outputs.version }}
          name: ${{ matrix.name }} ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/${{ matrix.slug }}-${{ steps.meta.outputs.version }}.zip
            dist/${{ matrix.slug }}-SHA256SUMS.txt
