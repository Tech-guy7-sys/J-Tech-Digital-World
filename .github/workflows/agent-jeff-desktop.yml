name: Build Agent Jeff Windows Desktop
on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/AgentJeff/**"
      - ".github/workflows/agent-jeff-desktop.yml"
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore desktop/AgentJeff/AgentJeff.csproj
      - name: Build
        run: dotnet build desktop/AgentJeff/AgentJeff.csproj --configuration Release --no-restore
      - name: Publish self-contained Windows x64
        run: dotnet publish desktop/AgentJeff/AgentJeff.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output artifacts/AgentJeff-win-x64
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentJeff-Windows-x64
          path: artifacts/AgentJeff-win-x64/
          if-no-files-found: error
          retention-days: 14
