name: Build JT Desktop Installers

on:
  push:
    branches: [main]
    paths:
      - "desktop/jt-workspace-shell/**"
      - "scripts/build-jt-desktop-apps.mjs"
      - "scripts/build-site.mjs"
      - "jt-apps/**"
      - "package.json"
      - "DESKTOP-INSTALLERS-REPAIR-UNINSTALL-GUIDE.md"
      - ".github/workflows/publish-jt-desktop-installers.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.0.0)"
        required: true
        default: "1.0.0"
        type: string
      publish_release:
        description: "Publish a GitHub pre-release after every build succeeds"
        required: true
        default: false
        type: boolean
permissions:
  contents: write

concurrency:
  group: jt-desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            arch: x64
            runner: windows-latest
          - platform: win
            arch: arm64
            runner: windows-latest
          - platform: win
            arch: ia32
            runner: windows-latest
          - platform: mac
            arch: x64
            runner: macos-13
          - platform: mac
            arch: arm64
            runner: macos-14
          - platform: linux
            arch: x64
            runner: ubuntu-latest
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source syntax
        shell: bash
        run: |
          node --check desktop/jt-workspace-shell/main.cjs
          node --check desktop/jt-workspace-shell/electron-builder.config.cjs
          node --check scripts/build-jt-desktop-apps.mjs
          node --check scripts/build-site.mjs
      - name: Build website assets
        run: npm run build:website
      - name: Install desktop packaging dependencies
        working-directory: desktop/jt-workspace-shell
        run: npm install --no-audit --no-fund
      - name: Package all JT workspaces
        shell: bash
        env:
          JT_PLATFORM: ${{ matrix.platform }}
          JT_ARCH: ${{ matrix.arch }}
          JT_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || format('1.0.0-ci.{0}', github.run_number) }}
        run: |
          VERSION="$JT_RELEASE_VERSION"
          VERSION="${VERSION#jt-desktop-v}"
          VERSION="${VERSION#v}"
          export JT_RELEASE_VERSION="$VERSION"
          node scripts/build-jt-desktop-apps.mjs
      - name: Upload platform packages
        uses: actions/upload-artifact@v4
        with:
          name: jt-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified desktop release
    needs: build
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jt-desktop-*
          path: combined-release
          merge-multiple: false
      - name: Prepare release files and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find combined-release -type f -print0 | while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            parent="$(basename "$(dirname "$file")")"
            cp "$file" "release/${parent}-${base}"
          done
          test "$(find release -type f | wc -l)" -gt 0
          (cd release && sha256sum * > SHA256SUMS.txt)
          cat > release/RELEASE-NOTES.md <<'EOF'
          # JT Digital World Desktop Workspaces

          These are desktop wrappers for the current JT web workspaces. The separate Agent Jeff desktop agent is released from its own repository.

          Packages are unsigned unless explicitly stated otherwise. SHA-256 checksums provide integrity checks, not publisher identity. Windows x86/ia32 packages are not offered because the current supported Electron target is 64-bit/ARM64.

          Repair/update by rerunning the Windows setup installer, replacing the macOS app from the official DMG/ZIP, or reinstalling the Linux package. See DESKTOP-INSTALLERS-REPAIR-UNINSTALL-GUIDE.md in the source repository for platform-specific instructions.

          These wrappers do not imply that remote AI, cloud, account, or native app-specific services are configured.
          EOF
          cp DESKTOP-INSTALLERS-REPAIR-UNINSTALL-GUIDE.md release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('jt-desktop-v{0}', github.event_name == 'workflow_dispatch' && inputs.version || format('1.0.0-ci.{0}', github.run_number)) }}
          name: JT Digital World Desktop ${{ github.event_name == 'workflow_dispatch' && inputs.version || format('1.0.0-ci.{0}', github.run_number) }}
          prerelease: true
          generate_release_notes: true
          files: |
            release/*
