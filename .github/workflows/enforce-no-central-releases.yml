name: Keep Only JT Workspace Apps Releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enforce-approved-jt-workspace-releases
  cancel-in-progress: false

jobs:
  keep-approved-workspace-releases:
    name: Preserve JT Workspace Apps releases only
    runs-on: ubuntu-latest
    steps:
      - name: Remove releases that are not JT Workspace Apps product bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tags="$(gh release list --limit 100 --json tagName --jq '.[].tagName')"
          if [ -z "$tags" ]; then
            echo "No releases exist yet. Only jt-workspaces-v* product releases are allowed."
            exit 0
          fi
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            if [[ "$tag" == jt-workspaces-v* ]]; then
              echo "Preserving approved JT Workspace Apps release: $tag"
            else
              echo "Removing non-product company release and tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done <<< "$tags"
          unexpected="$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("jt-workspaces-v") | not)] | length')"
          if [ "$unexpected" != "0" ]; then
            echo "Unexpected company releases remain: $unexpected" >&2
            exit 1
          fi
          echo "Verified: only approved JT Workspace Apps product releases may remain."
