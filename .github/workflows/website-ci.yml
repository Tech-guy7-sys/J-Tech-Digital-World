name: JT Digital World website CI

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "assets/**"
      - "jt-ai-agent/**"
      - "jt-apps/**"
      - "scripts/build-site.mjs"
      - "functions/**"
      - "scripts/test-jeff-api.mjs"
      - "scripts/test-jeff-project-context.mjs"
      - "scripts/test-jt-app-icons.mjs"
      - "scripts/test-jt-workspace-shell.mjs"
      - "scripts/test-jt-workspace-dashboard.mjs"
      - "scripts/test-jt-code-checks.mjs"
      - "scripts/test-jeff-ai-library.mjs"
      - "scripts/test-jt-cloud-file-controls.mjs"
      - "scripts/test-jt-design-image-import.mjs"
      - "scripts/test-jt-design-templates.mjs"
      - "scripts/generate-jt-app-icons.mjs"
      - "desktop/jt-workspace-shell/**"
      - "scripts/build-jt-desktop-apps.mjs"
      - "package.json"
      - "wrangler.toml"
      - ".github/workflows/website-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "assets/**"
      - "jt-ai-agent/**"
      - "jt-apps/**"
      - "scripts/build-site.mjs"
      - "scripts/test-jeff-project-context.mjs"
      - "scripts/test-jt-app-icons.mjs"
      - "scripts/generate-jt-app-icons.mjs"
      - "desktop/jt-workspace-shell/**"
      - "scripts/build-jt-desktop-apps.mjs"
      - "package.json"
      - "wrangler.toml"
      - ".github/workflows/website-ci.yml"

permissions:
  contents: read

jobs:
  build-static-website:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check scripts/generate-jt-app-icons.mjs
          node --check scripts/build-site.mjs
          node --check jt-ai-agent/workspace.js
          node --test scripts/test-jt-ai-workspace-polish.mjs
          node --check jt-ai-agent/project-context.js
          node --check functions/api/jeff.js
          node --check functions/api/integrations.js
          node --check functions/api/create-image.js
          node --check jt-apps/jt-design/image-studio.js
          node --check jt-apps/jt-stream/studio.js
          node --check jt-apps/jt-cloud-drive.js
          node --check jt-apps/workspace-tools.js
          node --check jt-apps/pro-workspaces.js
          node --test scripts/test-jt-code-checks.mjs scripts/test-jeff-ai-library.mjs scripts/test-jt-cloud-file-controls.mjs
          node --check jt-apps/command-deck.js
          node --check jt-apps/product-shell.js
          node --check jt-apps/workspace-dashboard.js
          node --check jt-ai-agent/library.js
          node --check jt-apps/jt-cloud-remote.js
          node --test scripts/test-jt-workspace-shell.mjs scripts/test-jt-workspace-dashboard.mjs
          node --check jt-apps/jt-design/studio.js
          node --test scripts/test-jt-design-image-import.mjs scripts/test-jt-design-templates.mjs scripts/test-jt-design-precision.mjs
          node --check jt-apps/shared-workspace-core.js
          node --check jt-apps/shared-workspace.js
          node --check jt-apps/app-power-tools.js
          grep -q "AI coding-agent handoff" jt-apps/pro-workspaces.js
          grep -q "Cloud provider connectors" jt-apps/pro-workspaces.js
          grep -q "Provider and agent compatibility" jt-apps/pro-workspaces.js
          grep -q "transitionSelect" jt-apps/jt-stream/studio.js
          grep -q "document.addEventListener(\"keydown\"" jt-apps/jt-stream/studio.js
          node --check release-downloads.js
      - name: Test JT AI gateway request validation
        run: |
          node scripts/test-jeff-api.mjs
          node scripts/test-image-api.mjs
      - name: Test JT desktop application icons
        run: node scripts/test-jt-app-icons.mjs
      - name: Test opt-in Jeff AI shared project context
        run: node scripts/test-jeff-project-context.mjs
      - name: Test shared JT project notes and handoff permissions
        run: node scripts/test-shared-workspace.mjs
      - name: Build public website files
        run: npm run build:website
      - name: Verify required output
        run: |
          for file in index.html home.html apps.html style.css; do
            test -f "dist/$file"
          done
          test -f dist/google7018b6a6a6547361.html
          grep -qx 'google-site-verification: google7018b6a6a6547361.html' dist/google7018b6a6a6547361.html
          test -f functions/api/jeff.js
          test -f dist/jt-ai-agent/index.html
          test -f dist/jt-ai-agent/workspace.js
          test -f dist/jt-ai-agent/project-context.js
          for app in jt-ai-core jt-app-manager jt-cloud jt-code jt-design jt-motion jt-studio jt-stream; do
            test -f "dist/jt-apps/$app/index.html"
          done
          test -f dist/jt-apps/agent-jeff/index.html
          test -f dist/jt-apps/jt-stream/studio.html
          test -f dist/jt-apps/jt-stream/studio.js
          test -f dist/jt-apps/jt-design/studio.html
          test -f dist/jt-apps/jt-design/studio.js
          test -f dist/jt-apps/jt-design/studio.css
          test -f dist/jt-apps/workspace.html
          test -f dist/jt-apps/workspace-dashboard.js
          test -f dist/jt-apps/workspace-dashboard.css
          test -f dist/jt-ai-agent/library.html
          test -f dist/jt-ai-agent/library.js
          test -f dist/jt-apps/jt-cloud-drive.js
          test -f dist/jt-apps/jt-cloud-drive.css
          test -f dist/jt-apps/workspace-tools.js
          test -f dist/jt-apps/pro-workspaces.js
          test -f dist/jt-apps/command-deck.js
          test -f dist/jt-apps/app-power-tools.js
          for ext in png ico icns; do
            test -s "desktop/jt-workspace-shell/build/icons/jt-ai-agent.$ext"
          done
