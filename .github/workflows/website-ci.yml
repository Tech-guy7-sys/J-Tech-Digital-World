name: JT Digital World website CI

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "assets/**"
      - "jt-ai-agent/**"
      - "jt-apps/**"
      - "scripts/build-site.mjs"
      - "functions/**"
      - "scripts/test-jeff-api.mjs"
      - "scripts/test-jeff-project-context.mjs"
      - "scripts/test-jeff-project-context.mjs"
      - "package.json"
      - "wrangler.toml"
      - ".github/workflows/website-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "assets/**"
      - "jt-ai-agent/**"
      - "jt-apps/**"
      - "scripts/build-site.mjs"
      - "package.json"
      - "wrangler.toml"
      - ".github/workflows/website-ci.yml"

permissions:
  contents: read

jobs:
  build-static-website:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check scripts/build-site.mjs
          node --check jt-ai-agent/workspace.js
          node --check jt-ai-agent/project-context.js
          node --check functions/api/jeff.js
          node --check functions/api/integrations.js
          node --check functions/api/create-image.js
          node --check jt-apps/jt-design/image-studio.js
          node --check jt-apps/jt-stream/studio.js
          node --check jt-apps/jt-cloud-drive.js
          node --check jt-apps/workspace-tools.js
          node --check jt-apps/pro-workspaces.js
          node --check jt-apps/command-deck.js
          node --check jt-apps/shared-workspace-core.js
          node --check jt-apps/shared-workspace.js
          grep -q "AI coding-agent handoff" jt-apps/pro-workspaces.js
          grep -q "Cloud provider connectors" jt-apps/pro-workspaces.js
          grep -q "Provider and agent compatibility" jt-apps/pro-workspaces.js
          grep -q "transitionSelect" jt-apps/jt-stream/studio.js
          grep -q "document.addEventListener(\"keydown\"" jt-apps/jt-stream/studio.js
          node --check release-downloads.js
      - name: Test JT AI gateway request validation
        run: node scripts/test-jeff-api.mjs
          node scripts/test-image-api.mjs
      - name: Test opt-in Jeff AI shared project context
        run: node scripts/test-jeff-project-context.mjs
      - name: Test shared JT project notes and handoff permissions
        run: node scripts/test-shared-workspace.mjs
      - name: Build public website files
        run: npm run build:website
      - name: Verify required output
        run: |
          test -f dist/index.html
          test -f dist/home.html
          test -f dist/apps.html
          test -f dist/google7018b6a6a6547361.html
          grep -qx 'google-site-verification: google7018b6a6a6547361.html' dist/google7018b6a6a6547361.html
          test -f dist/style.css
          test -f functions/api/jeff.js
          test -f dist/jt-apps/jt-stream/studio.html
          test -f dist/jt-apps/jt-stream/studio.css
          test -f dist/jt-ai-agent/workspace.js
          test -f dist/jt-ai-agent/project-context.js
          grep -q type=module dist/jt-ai-agent/index.html
          test -f dist/jt-apps/jt-design/image-studio.js
          grep -q "jtImageStudio" dist/jt-apps/jt-design/index.html
          grep -q "image-studio.js" dist/jt-apps/jt-design/index.html
          grep -q 'providerSelect' dist/jt-ai-agent/index.html
          grep -q 'model:providerSelect.value' dist/jt-ai-agent/workspace.js
          ! grep -q 'claude-sonnet' dist/jt-ai-agent/index.html
          grep -q 'free-tier-only' functions/api/jeff.js
          test -f dist/jt-apps/jt-stream/studio.js
          test -f dist/jt-apps/workspace-tools.js
          test -f dist/jt-apps/pro-workspaces.js
          test -f dist/jt-apps/command-deck.js
          grep -q 'JT Command Deck' dist/jt-apps/command-deck.js
          grep -q 'Export JT local workspace backup' dist/jt-apps/command-deck.js
          grep -q 'Import JT local workspace backup' dist/jt-apps/command-deck.js
          grep -q 'command-deck.js' dist/jt-apps/app.js
          for app in jt-ai-core jt-app-manager jt-code jt-design jt-motion jt-studio agent-jeff jt-stream; do
            grep -q 'pro-workspaces.js' "dist/jt-apps/$app/index.html"
          done
          for app in jt-ai-core jt-app-manager jt-code jt-design jt-motion jt-studio agent-jeff; do
            test -f "dist/jt-apps/$app/index.html"
            grep -q 'data-workspace-tool' "dist/jt-apps/$app/index.html"
            grep -q 'workspace-tools.js' "dist/jt-apps/$app/index.html"
          done
          test -f dist/jt-apps/jt-cloud-drive.js
          test -f dist/jt-apps/jt-cloud-drive.css
          grep -q 'jt-cloud-drive.js' dist/jt-apps/jt-cloud/index.html
          grep -q 'data-jt-cloud-drive' dist/jt-apps/jt-cloud/index.html
          grep -q 'local-first' dist/jt-apps/jt-cloud/index.html
          grep -q 'JT Motion' dist/jt-apps/jt-motion/index.html
          grep -q 'motionTimeline' dist/jt-apps/workspace-tools.js
          grep -q 'MediaRecorder' dist/jt-apps/workspace-tools.js
          grep -q 'releaseLabList' dist/jt-apps/workspace-tools.js
          grep -q 'Open JT Stream Studio' dist/jt-apps/jt-stream/index.html
          grep -q 'programCanvas' dist/jt-apps/jt-stream/studio.html
