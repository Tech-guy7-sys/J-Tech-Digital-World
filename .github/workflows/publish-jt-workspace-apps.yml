name: Publish JT Workspace Apps Releases

on:
  push:
    tags:
      - "jt-workspaces-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0-preview.1 or 1.0.0"
        required: true
        default: "0.1.0-preview.1"
        type: string

permissions:
  contents: write

concurrency:
  group: jt-workspace-product-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            arch: x64
            runner: windows-latest
          - platform: win
            arch: ia32
            runner: windows-latest
          - platform: win
            arch: arm64
            runner: windows-latest
          - platform: mac
            arch: x64
            runner: macos-15-intel
          - platform: mac
            arch: arm64
            runner: macos-14
          - platform: linux
            arch: x64
            runner: ubuntu-latest
          - platform: linux
            arch: arm64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select and validate release version
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#jt-workspaces-v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid JT Workspace Apps version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate source and app icons
        run: |
          node --check scripts/build-jt-desktop-apps.mjs
          node --check desktop/jt-workspace-shell/main.cjs
          node --check desktop/jt-workspace-shell/electron-builder.config.cjs
          node scripts/test-jt-app-icons.mjs
      - name: Build website payload
        run: npm run build:website
      - name: Install desktop packaging dependencies
        working-directory: desktop/jt-workspace-shell
        run: npm install --no-audit --no-fund
      - name: Package the five central JT workspaces
        shell: bash
        env:
          JT_PLATFORM: ${{ matrix.platform }}
          JT_ARCH: ${{ matrix.arch }}
          JT_APP_IDS: jt-ai-agent,jt-ai-core,jt-code,jt-design,jt-stream
          JT_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${JT_RELEASE_VERSION#jt-workspaces-v}"
          VERSION="${VERSION#v}"
          export JT_RELEASE_VERSION="$VERSION"
          node scripts/build-jt-desktop-apps.mjs
          mv release-assets/SHA256SUMS.txt "release-assets/SHA256SUMS-${JT_PLATFORM}-${JT_ARCH}.txt"
          mv release-assets/BUILD-METADATA.txt "release-assets/BUILD-METADATA-${JT_PLATFORM}-${JT_ARCH}.txt"
      - name: Upload platform packages
        uses: actions/upload-artifact@v4
        with:
          name: jt-workspace-release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish versioned JT Workspace Apps release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: jt-workspace-release-*
          path: release-assets
          merge-multiple: true
      - name: Create combined release manifest
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' ! -name 'BUILD-METADATA*' ! -name 'PLATFORM-MATRIX.txt' -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat > PLATFORM-MATRIX.txt <<'MATRIX'
          JT AI Agent, JT AI Core, JT Code, JT Design and JT Stream
          Windows: x64, x86/ia32 and ARM64 build targets
          macOS: Intel x64 and Apple Silicon ARM64
          Linux: x64 and ARM64
          Package formats are generated by electron-builder for the target operating system.
          Packages are unsigned unless a release explicitly documents otherwise.
          MATRIX
      - name: Select release tag
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            TAG="jt-workspaces-v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#jt-workspaces-v}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish JT Workspace Apps release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: JT Workspace Apps v${{ steps.release.outputs.version }} — Windows, macOS and Linux
          prerelease: ${{ contains(steps.release.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            Versioned desktop packages for the five central JT workspaces:

            - JT AI Agent
            - JT AI Core
            - JT Code
            - JT Design
            - JT Stream

            Separate installers/archives are attached by product, operating system and architecture. Windows targets x64, x86/ia32 and ARM64; macOS targets Intel x64 and Apple Silicon ARM64; Linux targets x64 and ARM64.

            Verify the combined SHA-256 manifest before installing. Packages are unsigned unless explicitly stated otherwise; macOS packages are not notarized by this workflow. A successful build is not a substitute for manual installation and feature testing on each target OS.
          files: release-assets/*
