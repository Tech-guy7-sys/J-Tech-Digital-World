name: JT Cloud workspace tests

on:
  push:
    branches:
      - feat/jt-ecosystem-visual-refresh
      - feat/jt-cloud-r2-jeff-ai-workspace
  pull_request:
    branches:
      - main
    paths:
      - "jt-apps/jt-cloud/**"
      - "jt-apps/jt-cloud-drive.*"
      - "jt-apps/jt-cloud-remote.*"
      - "functions/api/cloud/**"
      - "functions/api/jeff.js"
      - "db/cloud-schema.sql"
      - "jt-ai-agent/**"
      - "jt-apps/workspace-home.js"
      - "jt-apps/workspace-tools.js"
      - "jt-apps/pro-workspaces.js"
      - "jt-apps/app-power-tools.js"
      - "jt-apps/app.js"
      - "jt-apps/RELEASE-NOTES.md"
      - "pricing.html"
      - "scripts/test-jt-cloud-api.mjs"
      - "scripts/test-jeff-api.mjs"
      - "scripts/test-jt-cloud-drive.mjs"
      - "scripts/build-site.mjs"
      - "package.json"
      - ".github/workflows/jt-cloud-tests.yml"

jobs:
  jt-cloud:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check cloud and AI workspace JavaScript syntax
        run: |
          node --check functions/api/cloud/_shared.js
          node --check functions/api/cloud/files.js
          node --check "functions/api/cloud/files/[id].js"
          node --check functions/api/cloud/usage.js
          node --check jt-apps/jt-cloud-remote.js
          node --check jt-apps/jt-ai-core/core-status.js
          node --check jt-apps/workspace-home.js
          node --check jt-apps/workspace-tools.js
          node --check jt-apps/pro-workspaces.js
          node --check jt-apps/shared-workspace-core.js
          node --check jt-apps/shared-workspace.js
          node --check jt-apps/app-power-tools.js
          node --check jt-apps/app.js
          node --check jt-ai-agent/workspace.js
          node --check functions/api/jeff.js
      - name: Run JT Cloud regression tests
        run: npm run test:jt-cloud
      - name: Run shared workspace permission tests
        run: node --test scripts/test-shared-workspace.mjs
      - name: Build website for Cloudflare Pages
        run: npm run build:website
