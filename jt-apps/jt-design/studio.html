<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6f8"><title>JT Design Studio</title><link rel="stylesheet" href="studio.css"></head>
<body>
<header class="ds-topbar"><a class="ds-brand" href="/jt-apps/jt-design/"><span class="ds-logo">JT</span><span><b>JT Design</b><small>DESIGN STUDIO</small></span></a><div class="ds-file"><span class="ds-breadcrumb">Workspace / Design</span><input id="designName" maxlength="70" value="Untitled design" aria-label="Design name"></div><div class="ds-top-actions"><span class="ds-save-state" id="saveState">Saved locally</span><button id="undoBtn" class="ds-icon-btn" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button><button id="redoBtn" class="ds-icon-btn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button><button id="exportSvg" class="ds-secondary-btn">Export SVG</button><button id="exportPng" class="ds-primary-btn">Export PNG</button></div></header>
<div class="ds-workspace">
<aside class="ds-left"><div class="ds-panel-head"><span>TOOLS</span><span class="ds-muted">Add to canvas</span></div>
<div class="ds-tools"><button data-add="select" class="ds-tool active"><span>↖</span><small>Select</small></button><button data-add="rect" class="ds-tool"><span>▱</span><small>Rectangle</small></button><button data-add="ellipse" class="ds-tool"><span>◯</span><small>Ellipse</small></button><button data-add="text" class="ds-tool"><span>T</span><small>Text</small></button><button id="importImageBtn" class="ds-tool"><span>▧</span><small>Image</small></button><input id="importImageFile" type="file" accept="image/png,image/jpeg,image/webp" hidden></div>
<div class="ds-divider"></div><div class="ds-panel-head"><span>LAYERS</span><button id="addLayer" class="ds-small-plus" title="Add layer">＋</button></div><div id="layerList" class="ds-layer-list"></div>
<div class="ds-left-bottom"><a href="/jt-apps/jt-design/">← Design home</a><span>JT DIGITAL WORLD</span></div></aside>
<main class="ds-center"><div class="ds-canvas-toolbar"><div class="ds-presets"><label for="designTemplate">Start from</label><select id="designTemplate"><option value="">Choose template…</option><option value="social">Social announcement</option><option value="event">Event poster</option><option value="quote">Quote card</option><option value="thumbnail">Video thumbnail</option></select><label for="canvasPreset">Canvas</label><select id="canvasPreset"><option value="presentation">Presentation · 16:10</option><option value="square">Social post · 1:1</option><option value="story">Story · 9:16</option><option value="wide">Video thumbnail · 16:9</option></select></div><div class="ds-zoom"><button id="zoomOut" aria-label="Zoom out">−</button><span id="zoomValue">100%</span><button id="zoomIn" aria-label="Zoom in">＋</button><button id="fitCanvas" title="Fit canvas">Fit</button></div></div>
<div class="ds-stage"><div class="ds-artboard-wrap" id="artboardWrap"><svg id="artboard" viewBox="0 0 900 560" role="img" aria-label="Design canvas" xmlns="http://www.w3.org/2000/svg"></svg></div></div><div class="ds-bottom-bar"><span id="canvasDimensions">900 × 560 px</span><span id="selectionStatus">No layer selected</span><span>Changes are saved in this browser</span></div></main>
<aside class="ds-right"><div class="ds-panel-head"><span>INSPECTOR</span><span class="ds-muted" id="selectedType">Canvas</span></div>
<section id="canvasInspector" class="ds-inspector"><h3>Canvas settings</h3><label class="ds-field">Background color<input type="color" id="canvasBg" value="#ffffff"></label><div class="ds-presets-row"><button data-bg="#ffffff" style="--swatch:#fff"></button><button data-bg="#f3f4f6" style="--swatch:#f3f4f6"></button><button data-bg="#111827" style="--swatch:#111827"></button><button data-bg="#fef3c7" style="--swatch:#fef3c7"></button><button data-bg="#e0e7ff" style="--swatch:#e0e7ff"></button></div><p class="ds-help">Choose a layer to edit its position, size, fill, opacity and text.</p></section>
<section id="objectInspector" class="ds-inspector" hidden><h3 id="objectHeading">Selected layer</h3><label class="ds-field">Layer name<input id="objectName" maxlength="60"></label><label class="ds-field">Fill color<input type="color" id="objectFill" value="#635bdb"></label><div class="ds-two-fields"><label class="ds-field">X position<input type="number" id="objectX"></label><label class="ds-field">Y position<input type="number" id="objectY"></label></div><div class="ds-two-fields"><label class="ds-field">Width<input type="number" min="1" id="objectW"></label><label class="ds-field">Height<input type="number" min="1" id="objectH"></label></div><label class="ds-field">Opacity <output id="opacityValue">100%</output><input type="range" min="5" max="100" value="100" id="objectOpacity"></label><div id="textOptions" hidden><label class="ds-field">Text content<input id="objectText" maxlength="160"></label><label class="ds-field">Font size<input type="number" min="8" max="180" id="objectFontSize"></label><label class="ds-field">Text alignment<select id="objectAlign"><option value="start">Left</option><option value="middle">Center</option><option value="end">Right</option></select></label></div><div class="ds-object-actions"><button id="alignCenterX">Center horizontally</button><button id="alignCenterY">Center vertically</button><button id="moveUp">Bring forward</button><button id="moveDown">Send backward</button><button id="duplicateObject">Duplicate</button><button id="deleteObject" class="ds-danger">Delete layer</button></div></section>
<div class="ds-inspector-foot"><button id="newDesign" class="ds-secondary-btn">New design</button><button id="saveDesign" class="ds-primary-btn">Save design</button></div></aside></div><div class="ds-toast" id="toast" role="status"></div><script src="studio.js"></script></body></html>
