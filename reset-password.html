<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Reset password — JT Account</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/modern-ui.css"><link rel="stylesheet" href="/jt-account-auth.css"></head><body class="jt-auth-body"><main class="jt-auth-callback"><div class="jt-auth-mark">JT</div><p class="jt-auth-eyebrow">ACCOUNT RECOVERY</p><h1>Choose a new password</h1><form id="resetForm" class="jt-auth-form"><label class="jt-auth-field">New password<input id="newPassword" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></label><label class="jt-auth-field">Confirm password<input id="confirmPassword" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></label><button class="jt-auth-primary" type="submit">Update password</button></form><p id="resetStatus" role="status"></p><a class="jt-auth-back" href="/signin.html">Back to sign in</a></main><script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const form=document.getElementById("resetForm"),status=document.getElementById("resetStatus");
try{const c=await fetch("/api/auth/config",{cache:"no-store"}).then(r=>r.json());if(!c.configured)throw Error("JT Supabase Auth is not configured.");const supabase=createClient(c.url,c.anonKey,{auth:{flowType:"pkce",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});form.onsubmit=async e=>{e.preventDefault();const a=document.getElementById("newPassword").value,b=document.getElementById("confirmPassword").value;if(a!==b){status.textContent="Passwords do not match.";status.className="is-error";return}if(a.length<10){status.textContent="Use at least 10 characters.";status.className="is-error";return}const {error}=await supabase.auth.updateUser({password:a});if(error){status.textContent=error.message;status.className="is-error";return}status.textContent="Password updated. You can now sign in.";form.reset()}}catch(e){status.textContent=e.message;status.className="is-error"}
</script></body></html>
